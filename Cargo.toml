[workspace]
resolver = "3"
members = [
    "crates/eder",
    "crates/lp-shared",
    "crates/onewire",
    "crates/policy",
    "crates/proto",
    "crates/pyromat",
    "firmware/node",   # not in default-members: it only builds for the chip
    "xtask",
]
default-members = [   # what a plain `cargo test` covers
    "crates/eder",
    "crates/lp-shared",
    "crates/onewire",
    "crates/policy",
    "crates/proto",
    "crates/pyromat",
    "xtask",
]

[workspace.package]
edition = "2024"

[workspace.dependencies]
# Shared crate versions go here, so every crate uses the same ones.

# esp-* crates are pinned exactly: their unstable APIs can break on minor updates.
esp-backtrace = "=0.20.0"
esp-bootloader-esp-idf = "=0.6.0"
esp-hal = "=1.2.2"
esp-println = "=0.18.0"
esp-rtos = "=0.4.0"

critical-section = "1.2.0"
defmt = "1.0.1"
embassy-executor = "0.10.0"
embassy-time = "0.5.0"
static_cell = "2.1.1"

# Profiles from the esp-generate template.
# For fine tuning these settings, please refer to https://doc.rust-lang.org/cargo/reference/profiles.html
[profile.dev]
# The default debug profile is too slow and too big for resource-constrained devices.
# Always build with some optimizations enabled.
opt-level = "s"

[profile.release]
codegen-units = 1     # LLVM can perform better optimizations using a single thread
debug         = 2     # prefer slower builds but better debugging experience
lto           = 'fat'
opt-level     = 's'   # keep "s": the firmware is always built with --release
