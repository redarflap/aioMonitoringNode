# Runs on every push to main and on every pull request.
name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # The library crates and the xtask, on the PC.
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Installs the toolchain, components and targets from rust-toolchain.toml.
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Proves the libraries really are no_std: host tests can pass even when a
      # dependency secretly needs std.
      - run: cargo build --target riscv32imac-unknown-none-elf -p proto -p policy -p onewire -p lp-shared -p eder -p pyromat

  # The firmware of every node in nodes.toml.
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: rustup toolchain install
      # S3 only; delete this step together with S3 support.
      # Installs Espressif's `esp` toolchain, which `cargo xtask` uses for S3 nodes.
      - uses: esp-rs/xtensa-toolchain@v1.7
        with:
          buildtargets: esp32s3
      - uses: Swatinem/rust-cache@v2
      - run: cargo xtask check
      - run: cargo xtask build --all
