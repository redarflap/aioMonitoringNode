[package]
name = "node"
version = "0.1.0"
edition.workspace = true
rust-version = "1.95"

[dependencies]
esp-hal = { workspace = true, features = ["defmt", "esp32c6", "unstable"] }

esp-rtos = { workspace = true, features = ["defmt", "embassy", "esp32c6"] }

defmt = { workspace = true }
esp-bootloader-esp-idf = { workspace = true, features = ["defmt", "esp32c6"] }

embassy-executor = { workspace = true, features = ["defmt"] }
embassy-time = { workspace = true, features = ["defmt"] }
esp-backtrace = { workspace = true, features = [
  "defmt",
  "esp32c6",
  "panic-handler",
] }
esp-println = { workspace = true, features = ["defmt-espflash", "esp32c6"] }

critical-section = { workspace = true }
static_cell = { workspace = true }
