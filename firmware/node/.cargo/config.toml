# Keep compilation settings in this file and user/runtime settings in `esp-config.toml`.
# Cargo reads this file only when it runs inside firmware/node.
include = ["esp-config.toml"]

[target.riscv32imac-unknown-none-elf]
rustflags = [
  # Required to obtain backtraces (e.g. when using the "esp-backtrace" crate.)
  # NOTE: May negatively impact performance of produced code
  "-C", "force-frame-pointers",
]

# S3 only; delete this table together with S3 support.
[target.xtensa-esp32s3-none-elf]
rustflags = [
  "-C", "link-arg=-nostartfiles",
  # The linker warns that a memory region is readable, writable and executable.
  # That is normal on the S3, which doesn't enforce these permissions here.
  "-C", "link-arg=-Wl,--no-warn-rwx-segments",
]
