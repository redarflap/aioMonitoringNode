# Hardware: board name -> chip, radio chip and pin numbers.
# Each source adds its own pins (1-Wire, UART, ...) when it gets ported.
# A device's pins are decided right before it gets flashed; until then they may be placeholders.

[boards.c6-dev]                  # from the board's schematic
chip = "esp32c6"
radio = "sx127x"                 # SX1276
lora = { sck = 20, mosi = 19, miso = 18, cs = 21, rst = 22 }   # DIO0 isn't wired, so the firmware polls the radio

[boards.t3s3]                    # from docs/legacy-porting.md
chip = "esp32s3"
radio = "sx126x"
lora = { sck = 5, mosi = 6, miso = 3, cs = 7, rst = 8, irq = 33, busy = 34 }
