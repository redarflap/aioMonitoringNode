# Deployments: node name -> board, node_id, power mode and send intervals.
# Sources and HA devices arrive in later steps.

# First bytes that legacy nodes still send: feather-s3 0x00, pyromat 0x01, t3s3 0x02,
# eder gateway 0x7C (first byte of its MAC). Remove each once its node is reflashed.
reserved_node_ids = [0x00, 0x01, 0x02, 0x7C]

[nodes.dev-c6]
board = "c6-dev"
node_id = 100
power = "always-on"
heartbeat = 60      # s, short for testing
min_interval = 10   # s
