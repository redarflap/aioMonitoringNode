# Deployments: node name -> board, node_id, power mode, send intervals and sources.
# A node sends when a field changes by more than its threshold, but not more often than
# `min_interval`, and at least every `heartbeat` (both in s, 1 <= min_interval <= heartbeat).
# `sources.<name> = {}` turns a source on; every node needs at least one.
# Its parameters go inside the braces once it's ported.
# Threshold overrides go there too, in wire units, for example
# `sources.battery = { thresholds = { voltage = 2 } }` (more than 2 steps of 20 mV).
# Fields left out keep their default from crates/proto; a default can be "none" (never sends).
#
# HA devices: each node is one device with all its sources. `[devices.<key>]` moves sources
# into a device of its own, even from several nodes, for example
#   [devices.heating]
#   name = "Heating"
#   sources = ["dev-c6.battery"]   # "<node>.<source>"
# The key starts with a-z and holds only a-z, 0-9, `_` and `-`. A source can be in one
# device only. Run `cargo xtask schemas` after any change here.

# First bytes that legacy nodes still send: feather-s3 0x00, pyromat 0x01, t3s3 0x02,
# eder gateway 0x7C (first byte of its MAC). Remove each once its node is reflashed.
reserved_node_ids = [0x00, 0x01, 0x02, 0x7C]

[nodes.dev-c6]
board = "c6-dev"
node_id = 100
power = "always-on"
heartbeat = 60      # s, short for testing
min_interval = 10   # s
sources.battery = {}

[nodes.dev-s3]
board = "t3s3"
node_id = 101
power = "always-on"
heartbeat = 60      # s, short for testing
min_interval = 10   # s
sources.battery = {}
