[package]
name = "xtask"
version = "0.1.0"
edition.workspace = true

[dependencies]
# Without TLS: the broker is on the LAN.
rumqttc = { version = "0.25.1", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"

# The sources' fields and default thresholds.
proto = { path = "../crates/proto" }
